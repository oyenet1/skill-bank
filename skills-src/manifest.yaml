# Single source of truth for every skill target.
# scripts/gen_skills.py reads this and emits:
#   bundle      -> course-creator/subskills/<bundle>/SKILL.md
#   standalone  -> <standalone>/SKILL.md
# plus the declared shared modules into each target's references/.

shared_dir: _shared

# Shared modules are emitted as references/<file> into every target that lists them.
modules:
  intake: intake.md
  brand: brand.md
  video: video.md
  voice: voice.md
  preflight: preflight.md
  objects: objects.md
  slidev: slidev.md
  code: code.md

# prompts/ is copied as references/prompts/ for capabilities that list "prompts".

capabilities:

  map:
    standalone: curriculum-map
    bundle: course-creator-map
    modules: [intake]

  assets:
    standalone: visual-assets
    bundle: course-creator-assets
    modules: [intake, brand, objects]

  content-authoring:
    standalone: content-authoring
    bundle: course-creator-content-authoring
    modules: [intake, brand, code]

  slide-decks:
    standalone: slide-decks
    bundle: course-creator-slide-decks
    modules: [intake, brand, objects, preflight, slidev, code]
    shared_tools: [ensure_video_runtime.py, runtime_requirements.json]

  explainer-video:
    standalone: explainer-video
    bundle: course-creator-explainer-video
    modules: [intake, brand, video, voice, preflight, objects, slidev, code, prompts]
    shared_tools: [write_subtitles.py, review_captions.py, transcribe_captions.py, assemble_video.py, render_slidev_video.py, render_remotion_video.py, render_hyperframes_video.py, run_video_job.py, run_desktop_video_job.py, ensure_video_runtime.py, runtime_requirements.json]

  voice-narration:
    standalone: voice-narration
    bundle: course-creator-voice-narration
    modules: [intake, brand, voice, preflight]

  marketing-copy:
    standalone: marketing-copy
    bundle: course-creator-marketing-copy
    modules: [intake, brand]
    ships:
      - files/references/marketing-playbook.md
    library: [marketing]

  product-launch-video:
    standalone: product-launch-video
    bundle: course-creator-product-launch-video
    modules: [intake, brand, video, voice, preflight, objects, slidev, code, prompts]
    shared_tools: [write_subtitles.py, review_captions.py, transcribe_captions.py, assemble_video.py, render_remotion_video.py, render_hyperframes_video.py, run_video_job.py, run_desktop_video_job.py, ensure_video_runtime.py, runtime_requirements.json]
    ships:
      - files/references/workflow.md

  talking-head-video:
    standalone: talking-head-video
    bundle: course-creator-talking-head-video
    modules: [intake, brand, video, voice, preflight, objects, code]
    shared_tools: [write_subtitles.py, review_captions.py, transcribe_captions.py, assemble_video.py, render_hyperframes_video.py, run_video_job.py, run_desktop_video_job.py, ensure_video_runtime.py, runtime_requirements.json]

  avatar-video:
    standalone: avatar-video
    bundle: course-creator-avatar-video
    modules: [intake, brand, video, voice, preflight, objects, code]
    shared_tools: [write_subtitles.py, review_captions.py, transcribe_captions.py, assemble_video.py, render_hyperframes_video.py, run_video_job.py, run_desktop_video_job.py, ensure_video_runtime.py, runtime_requirements.json]
