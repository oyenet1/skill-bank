# Single source of truth for every skill target.
# scripts/gen_skills.py reads this and emits:
#   bundle      -> course-creator/subskills/<bundle>/SKILL.md
#   standalone  -> <standalone>/SKILL.md
# plus the declared shared modules into each target's references/.

shared_dir: _shared
bundle_bootstrap:
  routes: [explainer-video]
  voice: true
  transcription: true

# Shared modules are emitted as references/<file> into every target that lists them.
modules:
  intake: intake.md
  brand: brand.md
  video: video.md
  voice: voice.md
  preflight: preflight.md
  objects: objects.md
  slidev: slidev.md
  code: code.md
  generated-assets: generated-assets.md
  product-capture: product-capture.md
  storytelling: storytelling.md

# prompts/ is copied as references/prompts/ for capabilities that list "prompts".

# A capability with a `bootstrap:` block ships the cross-platform first-use
# installer (tools/bootstrap.py plus setup.sh/.cmd/.ps1) and a generated
# tools/dependencies.json. `routes` are ensure_video_runtime.py routes;
# `voice` adds the Kokoro narration step; `transcription` adds local speech
# recognition; `associated` lists standalone sibling skills to install if the
# target directory does not already contain them.

capabilities:

  storytelling:
    standalone: storytelling
    bundle: course-creator-storytelling
    modules: [intake, brand, storytelling, objects, slidev, code, generated-assets, voice, preflight]
    shared_tools: [bootstrap_uv.py, uv_wheels.json, network_tls.py, ensure_video_runtime.py, runtime_requirements.json, ensure_python_runtime.py, transcribe_with_faster_whisper.py]
    bootstrap:
      routes: [slide-decks]
      voice: true
      transcription: true
      associated: [slide-decks, visual-assets, voice-narration, explainer-video]

  map:
    standalone: curriculum-map
    bundle: course-creator-map
    modules: [intake]

  assets:
    standalone: visual-assets
    bundle: course-creator-assets
    modules: [intake, brand, objects, generated-assets]
    shared_tools: [bootstrap_uv.py, uv_wheels.json, network_tls.py, generate_image_asset.py]
    bootstrap:
      routes: []
      associated: []

  content-authoring:
    standalone: content-authoring
    bundle: course-creator-content-authoring
    modules: [intake, brand, code, storytelling, objects, slidev]

  slide-decks:
    standalone: slide-decks
    bundle: course-creator-slide-decks
    modules: [intake, brand, objects, preflight, slidev, code, storytelling]
    shared_tools: [bootstrap_uv.py, uv_wheels.json, network_tls.py, ensure_video_runtime.py, runtime_requirements.json]
    bootstrap:
      routes: [slide-decks]
      associated: [visual-assets, explainer-video]

  explainer-video:
    standalone: explainer-video
    bundle: course-creator-explainer-video
    modules: [intake, brand, video, voice, preflight, generated-assets, product-capture, objects, slidev, code, prompts, storytelling]
    shared_tools: [capture_product_screens.py, capture_product_screens.cjs, bootstrap_uv.py, uv_wheels.json, network_tls.py, generate_image_asset.py, write_subtitles.py, review_captions.py, transcribe_captions.py, ensure_python_runtime.py, transcribe_with_faster_whisper.py, assemble_video.py, render_slidev_video.py, render_remotion_video.py, render_hyperframes_video.py, run_video_job.py, run_desktop_video_job.py, author_desktop_video.py, desktop_fonts.py, render_desktop_sources.py, ensure_video_runtime.py, runtime_requirements.json]
    bootstrap:
      routes: [explainer-video]
      voice: true
      transcription: true
      associated: [voice-narration, product-launch-video, slide-decks, visual-assets]

  voice-narration:
    standalone: voice-narration
    bundle: course-creator-voice-narration
    modules: [intake, brand, voice, preflight]
    bootstrap:
      routes: []
      voice: true
      associated: [explainer-video, product-launch-video]

  marketing-copy:
    standalone: marketing-copy
    bundle: course-creator-marketing-copy
    modules: [intake, brand, storytelling, objects, slidev]
    ships:
      - files/references/marketing-playbook.md
    library: [marketing]

  product-launch-video:
    standalone: product-launch-video
    bundle: course-creator-product-launch-video
    modules: [intake, brand, video, voice, preflight, generated-assets, product-capture, objects, slidev, code, prompts, storytelling]
    shared_tools: [capture_product_screens.py, capture_product_screens.cjs, bootstrap_uv.py, uv_wheels.json, network_tls.py, generate_image_asset.py, write_subtitles.py, review_captions.py, transcribe_captions.py, ensure_python_runtime.py, transcribe_with_faster_whisper.py, assemble_video.py, render_remotion_video.py, render_hyperframes_video.py, run_video_job.py, run_desktop_video_job.py, author_desktop_video.py, desktop_fonts.py, render_desktop_sources.py, ensure_video_runtime.py, runtime_requirements.json]
    bootstrap:
      routes: [product-launch-video]
      voice: true
      transcription: true
      associated: [explainer-video, voice-narration]
    ships:
      - files/references/workflow.md

  talking-head-video:
    standalone: talking-head-video
    bundle: course-creator-talking-head-video
    modules: [intake, brand, video, voice, preflight, generated-assets, objects, code]
    shared_tools: [bootstrap_uv.py, uv_wheels.json, network_tls.py, generate_image_asset.py, write_subtitles.py, review_captions.py, transcribe_captions.py, ensure_python_runtime.py, transcribe_with_faster_whisper.py, assemble_video.py, render_hyperframes_video.py, run_video_job.py, run_desktop_video_job.py, author_desktop_video.py, desktop_fonts.py, render_desktop_sources.py, ensure_video_runtime.py, runtime_requirements.json]
    bootstrap:
      routes: [talking-head-video]
      voice: true
      transcription: true
      associated: [avatar-video, explainer-video, product-launch-video]

  avatar-video:
    standalone: avatar-video
    bundle: course-creator-avatar-video
    modules: [intake, brand, video, voice, preflight, generated-assets, objects, code]
    shared_tools: [bootstrap_uv.py, uv_wheels.json, network_tls.py, avatar_ensure.py, avatar_runtime.py, avatar_generate.py, avatar_infer_worker.py, avatar_provider.py, prepare_avatar_job.py, generate_image_asset.py, avatar_models.json, avatar_probe.py, avatar_pin.py, avatar_download.py, write_subtitles.py, review_captions.py, transcribe_captions.py, ensure_python_runtime.py, transcribe_with_faster_whisper.py, assemble_video.py, render_hyperframes_video.py, run_video_job.py, run_desktop_video_job.py, author_desktop_video.py, desktop_fonts.py, render_desktop_sources.py, ensure_video_runtime.py, runtime_requirements.json]
    bootstrap:
      routes: [avatar-video]
      voice: true
      transcription: true
      associated: [talking-head-video, voice-narration]

  motion-graphics-video:
    standalone: motion-graphics-video
    bundle: course-creator-motion-graphics-video
    modules:
    - intake
    - brand
    - video
    - voice
    - preflight
    - objects
    - generated-assets
    - code
    shared_tools:
    - bootstrap_uv.py
    - uv_wheels.json
    - network_tls.py
    - generate_image_asset.py
    - write_subtitles.py
    - review_captions.py
    - transcribe_captions.py
    - ensure_python_runtime.py
    - transcribe_with_faster_whisper.py
    - assemble_video.py
    - render_remotion_video.py
    - render_hyperframes_video.py
    - run_video_job.py
    - run_desktop_video_job.py
    - author_desktop_video.py
    - desktop_fonts.py
    - render_desktop_sources.py
    - ensure_video_runtime.py
    - runtime_requirements.json
    bootstrap:
      routes:
      - explainer-video
      voice: true
      transcription: true
      associated:
      - voice-narration
      - visual-assets
